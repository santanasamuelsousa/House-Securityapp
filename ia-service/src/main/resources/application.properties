spring.application.name=house-security-groq
spring.main.web-application-type=none

groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions

# Modelo que entende imagens (confira em https://console.groq.com/docs/vision se mudou)
groq.model.vision=qwen/qwen3.8-27b

# Recomendado pela Groq para este modelo no modo "pensando"
groq.temperature=1.0

# Limite da resposta. O modelo gasta parte disso "pensando", por isso é alto
groq.max-tokens=6000

# Quanto a IA "pensa" antes de responder: low, medium ou high
# Se der erro 400 falando destes campos, deixe os dois vazios (sem nada depois do =)
groq.reasoning-effort=medium
groq.reasoning-format=hidden